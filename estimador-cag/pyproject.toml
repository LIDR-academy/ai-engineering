[project]
name = "estimador-cag"
version = "0.2.0"
description = "LIDR Session 02: CAG Estimator with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "openai>=1.60.0",
    "anthropic>=0.40.0",
    "litellm>=1.55.0",
    "psycopg2-binary>=2.9.10",
    "pandas>=2.2.0",
    "streamlit>=1.41.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
    "sse-starlette>=2.1.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.20",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "tiktoken>=0.7.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]
local-embeddings = [
    "sentence-transformers>=3.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
extend-ignore = ["E501"]
