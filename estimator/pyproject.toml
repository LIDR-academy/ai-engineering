[project]
name = "estimator"
version = "0.1.0"
description = "AI-powered software estimation service with typed input and versioned Jinja2 prompts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "litellm>=1.50",
    "instructor>=1.5",
    "redis>=5.0",
    "redisvl>=0.3",
    "streamlit>=1.40",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    # Session 7 — embedding pipeline (tiktoken for token counting; openai already above)
    "tiktoken>=0.7.0",
    # Session 7 live — chunking strategies comparison
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "nltk>=3.9",
    # Session 8 — pgvector persistence (async driver + vector type for SQLAlchemy)
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # SQLAlchemy's async engine requires greenlet; declared explicitly so host
    # runs (scripts/evals via `uv run`) work, not only the Docker image.
    "greenlet>=3.0",
    # Session 9 — RAG API hardening (per-API-key rate limiting)
    "slowapi>=0.1.9",
    # Session 10 — cross-encoder reranking (recall-then-rerank). Pulls torch.
    "sentence-transformers>=3.0",
    # torch/torchvision declared explicitly (they are otherwise only transitive
    # via sentence-transformers / unstructured-inference) so the CPU-only index
    # pin in [tool.uv.sources] below actually binds. Inference runs on CPU, so
    # the multi-GB CUDA wheels are never needed.
    "torch>=2.2",
    "torchvision>=0.17",
    # Session 6 — data-driven AI
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=24.0",
    "unstructured[all-docs]>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis>=2.20",
    "deepeval>=1.0",
    # Session 11 — RAGAS generation-quality evaluation (LLM-judge + embeddings).
    "ragas>=0.2",
    "datasets>=2.19",
]

# -----------------------------------------------------------------------------
# torch CPU-only build.
#
# `sentence-transformers` (Session 10 cross-encoder reranker, CPU inference only)
# pulls `torch`. On Linux, PyPI's default `torch` wheel is the CUDA build, which
# drags in ~16 `nvidia-*` wheels (~5-6 GB) that are dead weight in a CPU-only
# container (there is no GPU in dev or in any worktree). Pinning torch/torchvision
# to PyTorch's CPU index keeps the exact same API and results at a fraction of the
# size. `explicit = true` means ONLY the packages listed in [tool.uv.sources]
# resolve against this index — everything else stays on PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
