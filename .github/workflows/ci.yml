# =============================================================================
# Proyecto 2 — Continuous Integration (Session 15)
# =============================================================================
# One pipeline, two projects. The monorepo holds the business backend (Rails)
# and the AI service (Python/FastAPI); they are tested and built separately but
# gated together, because a green build means "these two versions work as a
# system", not "each one compiles".
#
# Design rules, in the order they matter:
#
#   1. CI NEVER CALLS THE MODEL. Every test doubles the LLM. This is not about
#      saving a few cents: a pipeline that hits a real provider is slow,
#      non-deterministic and rate-limited, so it fails for reasons that have
#      nothing to do with the commit. Evaluating model QUALITY is a different
#      job with a different cadence -- that is Session 16, and the hooks for it
#      are at the bottom of this file.
#   2. NO SECRETS IN THE REPO OR IN THE LOGS. The only key here is a syntactically
#      valid dummy. Real credentials live in the platform's secret manager and
#      are injected as environment variables at deploy time.
#   3. ONLY REBUILD WHAT CHANGED. `changes` computes path filters once; every
#      other job is conditional on it. Touching a Ruby view must not reinstall
#      torch.
#   4. MODULAR BY STAGE. Each job is one idea (test / contract / build / deploy)
#      so Session 16 can insert stages without rewriting the file.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run: the old answer is
# already obsolete, and CI minutes are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # publicar imágenes en GHCR (job `build`)

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0 — what changed?
  # ---------------------------------------------------------------------------
  # In a monorepo this is the difference between a 2-minute and a 20-minute
  # pipeline. Every downstream job reads these outputs.
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      ai-service: ${{ steps.filter.outputs.ai-service }}
      business-backend: ${{ steps.filter.outputs.business-backend }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai-service:
              - 'ai-service/**'
              - 'docs/contract/**'
              - '.github/workflows/ci.yml'
            business-backend:
              - 'business-backend/**'
              - '.github/workflows/ci.yml'
            deployment:
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '**/Dockerfile'
              - '**/docker-entrypoint*'

  # ---------------------------------------------------------------------------
  # Stage 1 — AI service: lint + tests with the LLM mocked
  # ---------------------------------------------------------------------------
  ai-service:
    name: AI service · lint & tests
    needs: changes
    if: needs.changes.outputs.ai-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    # The suite doubles Redis with fakeredis, but five test modules enter the
    # FastAPI lifespan, which opens a Postgres connection pool for the LangGraph
    # checkpointer. Without a real Postgres each of them blocks on the pool
    # timeout before the error is swallowed -- the tests still pass, they just
    # take minutes. A throwaway service container is cheaper than the wait.
    services:
      vector-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: estimator
          POSTGRES_PASSWORD: estimator
          POSTGRES_DB: estimator
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U estimator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A syntactically valid dummy, never a real key. `app/config.py` refuses
      # to build Settings without a provider key, so the suite cannot even be
      # collected without one -- but nothing here ever reaches the network.
      # tests/conftest.py additionally pins it, so a real key could not leak in.
      OPENAI_API_KEY: sk-test-not-a-real-key
      DATABASE_URL: postgresql+psycopg://estimator:estimator@localhost:5433/estimator
      # Left unset ON PURPOSE: an empty AI_SERVICE_TOKEN disables the service
      # token middleware, which is what lets the whole suite run unauthenticated.
      # `test` NO es un entorno válido: app/config.py lo declara como
      # Literal["development", "staging", "production"], así que get_settings()
      # revienta AL IMPORTAR y pytest ni llega a cargar conftest.py (exit 4).
      # El valor solo controla el renderizado de structlog: JSON en production,
      # consola en el resto.
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      # `--frozen` fails if uv.lock disagrees with pyproject.toml, so CI builds
      # the exact dependency set the lockfile pins -- the same property the
      # Docker image relies on.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Run tests (LLM mocked — no tokens spent)
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # Stage 2 — Business backend: security scans, lint, tests
  # ---------------------------------------------------------------------------
  business-backend:
    name: Business backend · scans, lint & tests
    needs: changes
    if: needs.changes.outputs.business-backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Resolved relative to working-directory, i.e.
          # business-backend/.ruby-version.
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: business-backend

      - name: Scan for Rails security vulnerabilities (static analysis)
        run: bin/brakeman --no-pager

      - name: Audit JavaScript dependencies
        run: bin/importmap audit

      - name: Lint
        run: bin/rubocop -f github

      # The suite stubs every AI-service call with WebMock, so it never needs
      # the AI service to be running -- the same "no live dependency" rule the
      # Python side follows.
      - name: Run tests (AI service stubbed with WebMock)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test

  # ---------------------------------------------------------------------------
  # Stage 3 — Contract between the two layers
  # ---------------------------------------------------------------------------
  # The job that only a multi-service repo needs. Each suite above can be green
  # while the two layers have drifted apart: rename an endpoint in the AI
  # service, keep its tests passing, and the Rails client 404s in production.
  # This asserts that every route the business backend calls still exists in the
  # AI service's OpenAPI document.
  contract:
    name: Contract · business backend ↔ AI service
    needs: [changes, ai-service]
    # `always()` is load-bearing: GitHub skips a job whose dependency was
    # skipped, and `ai-service` IS skipped on a Rails-only change. Without it,
    # the contract would silently stop being checked exactly when the client
    # side moved -- the case it exists to catch.
    if: >-
      always() && !contains(needs.*.result, 'failure') && !cancelled() &&
      (needs.changes.outputs.ai-service == 'true' || needs.changes.outputs.business-backend == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      OPENAI_API_KEY: sk-test-not-a-real-key

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Reads docs/contract/business-backend-consumed-routes.json and checks it
      # against the schema FastAPI generates from the live Pydantic models. No
      # server, no network.
      - name: Verify the /v1 contract
        run: uv run python scripts/check_contract.py

  # ---------------------------------------------------------------------------
  # Stage 4 — Build both images and publish them
  # ---------------------------------------------------------------------------
  # Tests passing proves the code works; this proves it SHIPS. A Dockerfile
  # breaks for reasons no unit test sees (a missing COPY, an unresolvable apt
  # package).
  #
  # The image is THE UNIT OF DEPLOYMENT. On a pull request we only build (the
  # gate); on `main` we also push to GHCR tagged by commit SHA, and that tag is
  # what makes a rollback possible: going back is pointing at another tag, not
  # rebuilding anything.
  #
  # The EC2 instance never builds. The AI service image is ~4.9 GB (torch, via
  # sentence-transformers); building it on a t3.medium is slow and runs out of
  # memory. CI builds once, the instance pulls.
  build:
    name: Build images
    needs: [changes, ai-service, business-backend, contract]
    # `always()` plus an explicit failure check: the test jobs are skipped when
    # their project did not change, and a skipped dependency must not block the
    # build. Without this, a docs-only commit never reaches the build stage.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ai-service
            context: ./ai-service
            build-args: ""
          - name: business-backend
            context: ./business-backend
            # WITHOUT THIS LINE THE PUBLISHED IMAGE IS A DEVELOPMENT IMAGE.
            # business-backend/Dockerfile defaults `ARG RAILS_ENV=development`;
            # only in production does it skip the dev/test gems and run
            # assets:precompile. Nothing else in the pipeline sets it.
            build-args: RAILS_ENV=production

    steps:
      - uses: actions/checkout@v4

      # Declarar EN VOZ ALTA a qué registro se va a escribir, y hacerlo ANTES de
      # construir nada. Sin esto el fallo de namespace o de credenciales aparece
      # al final, después de 15 minutos construyendo una imagen de 4,9 GB.
      #
      # Imprime BOOLEANOS, nunca valores: que un secreto esté definido o no es
      # información inocua; su contenido no.
      - name: Resolve registry namespace
        env:
          OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
        run: |
          echo "GHCR_OWNER variable set : ${{ vars.GHCR_OWNER != '' }}"
          echo "GHCR_PAT secret set     : ${{ secrets.GHCR_PAT != '' }}"
          echo "resolved namespace      : ghcr.io/${OWNER,,}"

      # Why the deploy job did or did not run, printed by a job that DOES run.
      # A skipped job runs no steps, so it cannot explain its own absence — and
      # "skipped" looks identical whether the gate is off or a dependency failed.
      #
      # Booleans only, never values: whether a secret is defined is harmless,
      # its content is not. And note vars.CD_ENABLED is compared as a STRING:
      # `True`, `"true"` or a trailing space all evaluate to false.
      - name: Deploy gate diagnostics
        run: |
          echo "ref            : ${{ github.ref }}  (needs refs/heads/main)"
          echo "event          : ${{ github.event_name }}  (needs push)"
          echo "CD_ENABLED     : '${{ vars.CD_ENABLED }}'  -> gate open: ${{ vars.CD_ENABLED == 'true' }}"
          echo "APP_DOMAIN set : ${{ vars.APP_DOMAIN != '' }}"
          echo "EC2_HOST set   : ${{ secrets.EC2_HOST != '' }}"
          echo "EC2_USER set   : ${{ secrets.EC2_USER != '' }}"
          echo "EC2_SSH_KEY set: ${{ secrets.EC2_SSH_KEY != '' }}"

      - uses: docker/setup-buildx-action@v3

      # Only needed when we are actually going to push.
      #
      # POR DEFECTO usa el GITHUB_TOKEN del propio workflow, que está acotado a
      # este repositorio y CADUCA CON LA EJECUCIÓN: no existe ninguna credencial
      # de registro de larga duración. Esa es la opción buena.
      #
      # La vía alternativa (`GHCR_OWNER` + `GHCR_PAT`) existe porque la
      # organización no permite publicar paquetes bajo su cuenta, así que hoy se
      # publica bajo una cuenta personal. Es una CONCESIÓN, no una mejora: un PAT
      # vive hasta que caduca o alguien lo revoca. El día que la organización dé
      # permisos, se borra el secreto y se pone `GHCR_OWNER` a la organización —
      # sin tocar este fichero.
      #
      # Una variable o un secreto sin definir evalúan a cadena vacía, que es
      # falsy, así que `||` deja el comportamiento por defecto intacto.
      - name: Log in to GHCR
        if: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_OWNER || github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<image>. Lowercased because the registry rejects
      # uppercase paths and GitHub usernames may contain them.
      - name: Compute image name
        id: img
        env:
          OWNER: ${{ vars.GHCR_OWNER || github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          # Push only from main. A pull request proves the image BUILDS; it has
          # no business publishing an artifact.
          # También en ejecución manual: es la vía deliberada para publicar desde
          # una rama de trabajo sin debilitar la regla "un pull request no publica".
          push: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' }}
          load: ${{ !((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch') }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # A cheap sanity check that the image is not merely built but present.
      - name: Smoke the image entrypoint
        if: ${{ !((github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch') }}
        run: docker image inspect ${{ steps.img.outputs.name }}:${{ github.sha }} > /dev/null

  # ---------------------------------------------------------------------------
  # Stage 5 — Deploy to the EC2 instance
  # ---------------------------------------------------------------------------
  # This one is REAL: it ships to the running system.
  #
  # The shape is deliberately boring — SSH in, pull the images CI just
  # published, restart the stack. No agent on the box, no orchestrator, no
  # bespoke tooling. On a single VM that is the honest amount of machinery.
  #
  # NOTE WHAT IS NOT HERE: application secrets. The pipeline holds an SSH key
  # and a hostname, nothing else. OPENAI_API_KEY, AI_SERVICE_TOKEN,
  # SECRET_KEY_BASE and the database URLs live in /opt/estimator/.env ON THE
  # INSTANCE, mode 600, put there once by a human. They never transit GitHub and
  # can never appear in a build log.
  #
  # Required repository secrets:  EC2_HOST · EC2_USER · EC2_SSH_KEY
  # Required repository variable: APP_DOMAIN
  deploy:
    name: Deploy to EC2
    needs: build
    # Gated on a repository VARIABLE, not on editing this file: to enable it,
    # set vars.CD_ENABLED = true under Settings > Secrets and variables >
    # Actions > Variables. Prerequisites:
    #   1. secrets   EC2_HOST · EC2_USER · EC2_SSH_KEY
    #   2. variables APP_DOMAIN · CD_ENABLED
    #
    # Note the `push` condition: a manual run (workflow_dispatch) deliberately
    # does NOT deploy. A deployment is always tied to a commit that landed on
    # main — otherwise there is nothing to roll back to.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      # The runner needs the repository twice over: to ship the deployment
      # files in the next step, and to run the smoke test in the last one.
      - uses: actions/checkout@v4

      # The deployment files travel FROM THE RUNNER. /opt/estimator is not a
      # git clone and turning it into one would mean leaving git credentials on
      # the instance — exactly the kind of long-lived secret this session
      # argues against. The application code does not travel here: it is
      # already baked into the images the previous job published.
      - name: Ship the deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/,scripts/"
          target: /opt/estimator
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pulling ~7.4 GB on a cold instance takes minutes.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/estimator

            # scp does not carry the executable bit.
            chmod +x scripts/*.sh deploy/*.sh 2>/dev/null || true

            # IMAGE_TAG pins this exact commit. `latest` would make the deploy
            # non-reproducible and the rollback impossible to express.
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
            else
              echo "IMAGE_TAG=${{ github.sha }}" >> .env
            fi

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull --quiet
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # A 30 GB volume fills fast when every deploy leaves a 4.9 GB image
            # behind. Running out of disk takes the databases down with it.
            docker image prune -af --filter "until=168h"

      # AFTER the deploy, against the deployed environment — never inside CI.
      # This is the one check that exercises the real model, which is exactly
      # why it does not belong in the pipeline above.
      #
      # `python3`, not `python`: ubuntu-latest ships no `python` alias unless
      # actions/setup-python ran. While this job was disabled the bug was
      # unobservable.
      - name: Smoke test the deployed environment
        run: |
          python3 scripts/smoke_test.py \
            --base-url "https://${{ vars.APP_DOMAIN }}" \
            --timeout 180

  # ===========================================================================
  # ===========================================================================
  # Session 16 — LLMOps plugged in HERE (and deliberately not here)
  # ===========================================================================
  # The hook this file reserved is filled, and the answer turned out to be "a
  # different file": `.github/workflows/eval.yml`.
  #
  # The reasoning is the one written at the top of this file, rule 1. Evaluating
  # model QUALITY calls the real model, so it is slow, costs money and is
  # non-deterministic. As a job in this pipeline it would make every ordinary
  # commit wait minutes and fail for reasons unrelated to the diff — and within a
  # week somebody would add `continue-on-error` and nobody would look at it again.
  #
  #     ci.yml    every commit · model mocked · a failure means "you broke the code"
  #     eval.yml  nightly + on demand · model real · "the system got worse"
  #
  # Two pipelines, two cadences, two meanings of red. What Session 16 added to
  # THIS file is nothing at all, and that is the point: the seam held.
  # ===========================================================================
